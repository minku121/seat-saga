spring.application.name=authService-test

# Use in-memory H2 database for all tests so CI / local builds don't depend on external databases
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Test JWT secret
jwt.secret=seatsaga4-seatsaga4-seatsaga4-seatsaga4
