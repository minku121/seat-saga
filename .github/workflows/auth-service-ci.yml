name: Auth Service CI/CD

on:
  push:
    paths:
      - 'authService/**'
      - '.github/workflows/auth-service-ci.yml'
    branches: [ "main", "master", "develop" ]
  pull_request:
    paths:
      - 'authService/**'
      - '.github/workflows/auth-service-ci.yml'
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Run Tests (Auth Service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./authService

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: authService/pom.xml

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Tests
        run: ./mvnw clean test

      - name: Build & Package Application JAR
        run: ./mvnw package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: authService/target/*.jar
          retention-days: 7

  docker-build:
    name: Docker Build Check (Auth Service)
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t auth-service:test ./authService
